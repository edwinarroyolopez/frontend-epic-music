[build]
  command = "npm run build"
  publish = "dist"

# Public build-time configuration, shared by production and deploy previews.
[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://backend-epic-music-production.up.railway.app"
  VITE_API_TIMEOUT = "20000"
  VITE_AI_TIMEOUT = "240000"

[context.dev.environment]
  VITE_API_URL = "http://localhost:7000"

# Navigation uses hashes (#/playlists): no catch-all rewrite or API proxy needed.
# public-html-plugin.mjs reads Netlify CONTEXT: previews get noindex in HTML
# and dist/_headers; production remains indexable. public/404.html is a real 404.

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
